<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>TravelHub B2B OTA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
/* Layout concept: one clickable prototype. Top bar switches Public site / Agent portal / Admin console; side rail for portal navigation; content cards on a cool-grey ground. */
:root{
  --bg:#f3f6fb; --surface:#ffffff; --surface2:#eaf0f9; --line:#d8e1ee;
  --fg:#10213d; --muted:#5a6b88; --accent:#1c58d9; --accent-ink:#ffffff; --accent-soft:#e3ecff;
  --good:#12805c; --good-soft:#dff5ec; --warn:#a15c00; --warn-soft:#fdf0d5; --bad:#c0352b; --bad-soft:#fde6e3;
  --f-display:'Manrope','Segoe UI',system-ui,sans-serif; --f-body:'IBM Plex Sans','Segoe UI',system-ui,sans-serif; --f-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b1424; --surface:#111e33; --surface2:#17263f; --line:#25365a;
  --fg:#e6edf9; --muted:#93a5c6; --accent:#6c9bff; --accent-ink:#0b1424; --accent-soft:#1a2d57;
  --good:#4cd6a1; --good-soft:#12362b; --warn:#f0b24d; --warn-soft:#3a2c10; --bad:#ff8a80; --bad-soft:#3d1a18; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1424; --surface:#111e33; --surface2:#17263f; --line:#25365a;
  --fg:#e6edf9; --muted:#93a5c6; --accent:#6c9bff; --accent-ink:#0b1424; --accent-soft:#1a2d57;
  --good:#4cd6a1; --good-soft:#12362b; --warn:#f0b24d; --warn-soft:#3a2c10; --bad:#ff8a80; --bad-soft:#3d1a18; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.5}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(28px,5vw,46px);line-height:1.08;font-weight:800}
h2{font-size:20px;font-weight:700}
h3{font-size:15px;font-weight:700}
p{margin:0}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.sm{font-size:12px}
.wrap{max-width:1240px;margin:0 auto;padding-inline:16px}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:10px}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:800;font-size:17px;margin-right:auto}
.brand i{width:28px;height:28px;border-radius:7px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.seg{display:flex;background:var(--surface2);border-radius:9px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:7px;font-weight:500;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(16,33,61,.15)}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:9px;width:36px;height:36px;display:grid;place-items:center}

svg.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* shell */
.shell{display:grid;grid-template-columns:224px minmax(0,1fr);gap:20px;padding-block:20px}
.shell.public{grid-template-columns:minmax(0,1fr)}
.rail{display:flex;flex-direction:column;gap:2px;align-self:start;position:sticky;top:calc(64px + env(safe-area-inset-top,0px))}
.rail .who{padding:10px 12px 14px;border-bottom:1px solid var(--line);margin-bottom:8px}
.rail button{display:flex;align-items:center;gap:10px;border:0;background:transparent;padding:9px 12px;border-radius:8px;text-align:left;color:var(--muted);font-weight:500}
.rail button:hover{background:var(--surface2);color:var(--fg)}
.rail button[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.rail .badge{margin-left:auto}
@media (max-width:900px){
  .shell{grid-template-columns:minmax(0,1fr);gap:12px}
  .rail{position:static;flex-direction:row;overflow-x:auto;gap:4px;padding-bottom:6px}
  .rail .who{display:none}
  .rail button{white-space:nowrap}
}

/* primitives */
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px}
.card.flat{background:var(--surface2);border-color:transparent}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr))}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:12px}
.pagehead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.pagehead p{color:var(--muted);margin-top:2px}
.kpi .lbl{font-size:12px;color:var(--muted)}
.kpi .val{font-family:var(--f-display);font-weight:800;font-size:26px;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi .sub{font-size:12px;margin-top:2px}
.up{color:var(--good)} .dn{color:var(--bad)} .wr{color:var(--warn)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 14px;font-weight:600;font-size:13px}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.good{color:var(--good)} .btn.bad{color:var(--bad)}
.btn.lg{padding:12px 20px;font-size:15px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap}
.p-good{background:var(--good-soft);color:var(--good)} .p-warn{background:var(--warn-soft);color:var(--warn)}
.p-bad{background:var(--bad-soft);color:var(--bad)} .p-info{background:var(--accent-soft);color:var(--accent)} .p-mute{background:var(--surface2);color:var(--muted)}
.badge{background:var(--accent);color:var(--accent-ink);border-radius:999px;font-size:11px;font-weight:700;padding:1px 7px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:500;min-width:0}
.in{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:9px 11px;color:var(--fg);min-width:0}
.in:focus{border-color:var(--accent)}
.form{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));align-items:end}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:12.5px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.divider{height:1px;background:var(--line);margin-block:2px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:500;z-index:50;max-width:calc(100% - 32px)}

/* landing */
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:28px;align-items:center;padding-block:24px}
@media (max-width:860px){.hero{grid-template-columns:minmax(0,1fr)}}
.hero p.lead{font-size:16px;color:var(--muted);margin-top:14px;max-width:52ch}
.supplier-strip{display:flex;gap:8px 18px;flex-wrap:wrap;font-family:var(--f-mono);font-size:12px;color:var(--muted);margin-top:18px}
.quote{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:0 12px 32px -18px rgba(16,33,61,.35)}
.fare-line{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:13px}
.fare-line:last-child{border-bottom:0}
.feature{display:flex;gap:12px}
.feature .ic-box{width:38px;height:38px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:14px;text-align:left}
.stats b{font-family:var(--f-display);font-size:28px;display:block}

/* auth */
.authbox{max-width:420px;margin:24px auto}
.otp{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.otp input{text-align:center;font-family:var(--f-mono);font-size:20px;padding:10px 0}
.steps{display:flex;gap:6px;flex-wrap:wrap}
.step{flex:1 1 130px;border-top:3px solid var(--line);padding-top:8px;font-size:12px;color:var(--muted)}
.step.done{border-color:var(--good);color:var(--fg)} .step.now{border-color:var(--accent);color:var(--fg)}
.step b{display:block;font-size:13px}

/* flights */
.flight{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,2fr) minmax(0,1.1fr);gap:16px;align-items:center}
@media (max-width:760px){.flight{grid-template-columns:minmax(0,1fr)}}
.route{display:flex;align-items:center;gap:12px}
.route .t{font-family:var(--f-display);font-weight:800;font-size:20px;font-variant-numeric:tabular-nums}
.route .line{flex:1;min-width:40px;height:2px;background:var(--line);position:relative;text-align:center}
.route .line span{position:absolute;left:50%;top:-9px;transform:translateX(-50%);background:var(--surface);padding:0 6px;font-size:11px;color:var(--muted);white-space:nowrap}
.airline-mark{width:36px;height:36px;border-radius:9px;background:var(--surface2);display:grid;place-items:center;font-family:var(--f-mono);font-weight:500;font-size:12px;flex:none}
.rules{background:var(--surface2);border-radius:9px;padding:10px 12px;font-size:12.5px;margin-top:12px;display:grid;gap:4px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 2px;font-size:11.5px;text-align:center}
.cal button b{display:block;font-size:12.5px;font-variant-numeric:tabular-nums}
.cal button.low{border-color:var(--good);color:var(--good)}
.cal button.sel{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

/* charts */
.chart text{fill:var(--muted);font-size:11px;font-family:var(--f-body)}
.chart .bar{fill:var(--accent)} .chart .bar.today{fill:var(--accent)} .chart .bar.prev{fill:var(--accent-soft)}
.chart .grid{stroke:var(--line);stroke-width:1}
.hbar{display:grid;grid-template-columns:130px minmax(0,1fr) 44px;gap:10px;align-items:center;font-size:13px;margin-block:8px}
.hbar .track{height:8px;background:var(--surface2);border-radius:4px;overflow:hidden}
.hbar .track i{display:block;height:100%;background:var(--accent);border-radius:4px}
.legend-note{font-size:12px;color:var(--muted)}
.dotok{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
@media (prefers-reduced-motion:no-preference){.card{transition:border-color .15s}}

.fx{border:1px solid var(--line);border-radius:14px;background:var(--surface);position:relative}
.fx-main{display:grid;grid-template-columns:minmax(0,1fr) 210px}
.fx-rows{padding:4px 20px}
.fx-row{display:grid;grid-template-columns:1.2fr .9fr 1.5fr .9fr;gap:14px;align-items:center;padding:16px 0}
.fx-row+.fx-row{border-top:1px solid var(--line)}
.fx-air{display:flex;gap:12px;align-items:center}
.fx-big{font-size:22px;font-family:var(--f-display);font-variant-numeric:tabular-nums}
.fx-mid{text-align:center}
.fx-line{display:flex;align-items:center;margin:8px 0 2px;color:var(--accent)}
.fx-line .ic{width:18px;height:18px;flex:none;margin-left:2px}
.fx-dot{width:10px;height:10px;border-radius:50%;border:2px solid var(--accent);flex:none}
.fx-dash{flex:1;border-top:2px dotted var(--line);min-width:20px}
.fx-stop{position:relative;width:10px;height:10px;flex:none}
.fx-stop i{display:block;width:10px;height:10px;border-radius:50%;border:2px solid var(--bad);background:var(--surface)}
.fx-stop em{position:absolute;top:-17px;left:50%;transform:translateX(-50%);font-style:normal;font-size:11px;color:var(--warn);font-weight:600}
.fx-codes{display:flex;justify-content:space-between;font-size:13px}
.fx-price{background:var(--warn-soft);border-radius:0 14px 0 0;padding:16px;display:flex;flex-direction:column;gap:6px;align-items:flex-end;justify-content:center;text-align:right}
.fx-amt{font-family:var(--f-display);font-weight:800;font-size:22px;font-variant-numeric:tabular-nums}
.fx-price .btn{width:100%}
.fx-foot{display:flex;align-items:center;gap:18px;flex-wrap:wrap;border-top:1px solid var(--line);padding:9px 20px;font-size:13px}
.fx-lk{border:0;background:none;color:var(--muted);font-weight:500;display:inline-flex;gap:6px;align-items:center;padding:4px 0}
.fx-lk:hover{color:var(--accent)}
.fx-pop{position:absolute;left:0;bottom:calc(100% + 8px);z-index:10;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px;box-shadow:0 8px 24px rgba(16,33,61,.18);min-width:300px}
.fx-tabs{display:grid;grid-template-columns:180px minmax(0,1fr);gap:18px;padding:16px 20px;border-top:1px solid var(--line)}
.fx-tabs nav{display:flex;flex-direction:column;gap:4px}
.fx-tabs nav button{border:0;background:none;text-align:left;padding:9px 12px;border-radius:8px;font-weight:500}
.fx-tabs nav button[aria-current="true"]{background:var(--warn-soft);color:var(--warn);font-weight:700}
.fx-sec{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.fx-note{display:flex;gap:10px;align-items:center;background:var(--accent-soft);color:var(--fg);border-radius:6px;padding:9px 12px;font-size:13px}
.fx-note .ic{width:16px;height:16px;color:var(--accent);flex:none}
.fx-seg{display:grid;grid-template-columns:1.3fr 1fr 1fr 80px;gap:14px;align-items:center;padding:10px 0}
.fx-lay{display:flex;justify-content:space-between;background:var(--bad-soft);color:var(--bad);border-left:3px solid var(--bad);border-radius:4px;padding:6px 12px;font-size:12.5px}
.fx-grand{background:var(--warn-soft);border-radius:8px;padding:6px 12px;font-size:16px}
.fx-sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
textarea.in{resize:vertical;font-family:inherit}
/* ---- UI/UX pass ---- */
:root{--shadow:0 1px 2px rgba(16,33,61,.05),0 6px 18px -12px rgba(16,33,61,.18)}
:root[data-theme="dark"]{--shadow:none}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--shadow:none}}
.card{box-shadow:var(--shadow)}
.card.flat,.card.kpi{box-shadow:none}
.pagehead h2{font-size:22px}
.btn{min-height:36px;transition:background .12s,border-color .12s,transform .06s,filter .12s}
.btn:active{transform:translateY(1px)}
.btn.pri{box-shadow:0 1px 0 rgba(16,33,61,.18)}
.in{transition:border-color .12s,box-shadow .12s}
.in:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);outline:none}
.chip{min-height:32px;transition:background .12s,border-color .12s}
.chip:hover{border-color:var(--accent)}
.chip[disabled]{opacity:.5;cursor:not-allowed}
tbody tr{transition:background .1s}
tbody tr:hover td{background:var(--surface2)}
.nw td,.nw th{white-space:nowrap;padding-inline:8px}
.nw{font-size:12.5px}
.nw td.wrapok{white-space:normal;min-width:100px}
.nw .pill{white-space:normal;display:inline-block;max-width:150px;text-align:left}
.nw td.stk,.nw th.stk{position:sticky;right:0;background:var(--surface)}
.nw td.stk{box-shadow:-10px 0 8px -8px rgba(16,33,61,.22)}
.nw tbody tr:hover td.stk{background:var(--surface2)}
.tablewrap{background:linear-gradient(90deg,var(--surface) 30%,transparent),linear-gradient(90deg,transparent,var(--surface) 70%) 100% 0,radial-gradient(farthest-side at 0 50%,rgba(16,33,61,.18),transparent),radial-gradient(farthest-side at 100% 50%,rgba(16,33,61,.18),transparent) 100% 0;background-repeat:no-repeat;background-size:40px 100%,40px 100%,12px 100%,12px 100%;background-attachment:local,local,scroll,scroll}
.skip{position:absolute;left:-999px;top:8px}
.skip:focus{left:12px;z-index:60;background:var(--surface);padding:8px 12px;border-radius:8px;border:1px solid var(--accent)}
main:focus{outline:none}
.rail-h{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;padding:14px 12px 4px}
.rail button{transition:background .12s,color .12s}
.sbar{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
.sbar>label.f{flex:1 1 150px}
.sbar .odrow{display:flex;gap:6px;align-items:flex-end;flex:2 1 300px}
.sbar .odrow label{flex:1}
.swapbtn{border:1px solid var(--line);background:var(--surface);color:var(--accent);border-radius:999px;width:36px;height:36px;font-size:16px;flex:none;margin-bottom:1px;transition:transform .2s,border-color .12s}
.swapbtn:hover{border-color:var(--accent);transform:rotate(180deg)}
.sbar .paxg{display:flex;gap:8px;flex:2 1 270px}
.sbar .paxg label{flex:1}
.sbar .btn.pri{flex:0 0 auto;min-height:40px;padding-inline:22px}
.frow{gap:10px}
.flbl{min-width:96px}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:16px 0 8px}
.toolbar .chips.scroll{flex:1 1 320px}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:thin;padding-bottom:2px}
.chips.scroll .chip{flex:none}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:36px 18px}
.empty .ic{width:28px;height:28px;color:var(--accent)}
.skel{pointer-events:none}
.sk{border-radius:8px;background:linear-gradient(90deg,var(--surface2),var(--line),var(--surface2));background-size:200% 100%}
.sk1{height:22px;width:70%;margin:18px 0 10px}.sk2{height:22px;width:50%;margin-bottom:18px}.sk3{height:26px;width:100%}
@media (prefers-reduced-motion:no-preference){.sk{animation:shim 1.1s linear infinite}.fx{transition:box-shadow .15s,border-color .15s}}
@keyframes shim{to{background-position:-200% 0}}
.fx{box-shadow:var(--shadow)}
.fx:hover{box-shadow:0 10px 26px -14px rgba(16,33,61,.35)}
.feat3{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:900px){.feat3{grid-template-columns:repeat(2,minmax(0,1fr))}.rail-h{display:none}}
@media (max-width:600px){
 .feat3{grid-template-columns:minmax(0,1fr)}
 .top .wrap{gap:8px}.brand{font-size:15px}
 .seg{order:3;width:100%}.seg button{flex:1;padding-inline:6px}
 .cal{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:4px}.cal button{flex:0 0 78px;scroll-snap-align:start}
 .fx-price{flex-direction:row;flex-wrap:wrap;align-items:center;gap:8px}.fx-price .btn{width:auto;flex:1 1 120px}
 .fx-rows{padding:2px 14px}.fx-foot{padding:9px 14px;gap:12px}
 .toolbar .seg{order:0}
 .btn,.chip,.in{min-height:40px}

function catOf(dob,on){
 if(!dob||!on)return null;
 const d=new Date(dob+'T00:00:00Z'),t=new Date(on+'T00:00:00Z');
 if(isNaN(d)||isNaN(t)||d>=t)return null;
 let y=t.getUTCFullYear()-d.getUTCFullYear();
 const m=t.getUTCMonth()-d.getUTCMonth(),dd=t.getUTCDate()-d.getUTCDate();
 if(m<0||(m===0&&dd<0))y--;

const wpPaidN=a=>{let n=0;while(n<3&&a.paid[n])n++;return n};
function wpCan(a){const nx=a.pipe+1;if(nx>4)return{ok:false,why:'Delivered. Nothing further to do.'};

const wpPill=a=>a.pipe===4?'p-good':wpCan(a).ok?'p-info':'p-warn';

const wpPay=(a,own)=>{const am=wpAmts(a),pn=wpPaidN(a);

  return `<tr><td>${i+1}. ${n}</td><td class="r num">${a.split[i]}%</td><td class="r num">${fmt(am[i])}</td><td><span class="pill ${st==='paid'?'p-good':st==='due'?'p-warn':'p-mute'}">${st==='paid'?'Settled':st==='due'?'Due now':'Locked until previous stage is settled'}</span></td>${own?`<td class="r">${st==='due'&&am[i]>0?`<button class="btn pri" data-x="wppay|${a.id}|${i}">Pay ${fmt(am[i])}</button>`:''}</td>`:''}</tr>`}).join('')}</tbody></table></div>`};

const mfaMail=()=>MFA_ROLE()==='admin'?'admin@aonestopsolution.example':(/@/.test(S.loginUser||'')?S.loginUser:'agent@skywings.example');
const maskMail=e=>{const p=String(e).split('@');return p[1]?p[0].slice(0,1)+'***@'+p[1]:e};
const secSync=()=>{S.admin=S.role==='admin'||(S.role!=='agent'&&S.admin)};
const mfaUriFor=sec=>'otpauth://totp/'+encodeURIComponent('TravelHub B2B:'+mfaMail())+'?secret='+sec+'&issuer='+encodeURIComponent('TravelHub B2B')+'&algorithm=SHA1&digits=6&period=30';
const mfaQrFor=sec=>{try{if(typeof qrcode!=='function')return '';const q=qrcode(0,'M');q.addData(mfaUriFor(sec));q.make();return q.createSvgTag({cellSize:4,margin:2,scalable:true})}catch(e){return ''}};
function eSend(purpose){const o=S.eotp;
 if(o&&o.sentAt&&Date.now()-o.sentAt<30000)return 'Please wait '+Math.ceil((30000-(Date.now()-o.sentAt))/1000)+' seconds before requesting another code.';
 const n=rndBytes(4),code=String((n[0]*16777216+n[1]*65536+n[2]*256+n[3])%1000000).padStart(6,'0');
 S.eotp={code,purpose,sentAt:Date.now(),exp:Date.now()+300000,fails:0,to:mfaMail()};return ''}
function eVerify(code,purpose){const o=S.eotp,m=mfaOf(MFA_ROLE());
 if(m.lock>Date.now())return 'Too many wrong codes. Try again in '+Math.ceil((m.lock-Date.now())/1000)+' seconds.';
 if(!o||o.purpose!==purpose)return 'No code has been sent. Request a new one.';
 if(Date.now()>o.exp){S.eotp=null;return 'That code expired. Request a new one.'}
 if(String(code).trim()===o.code){S.eotp=null;m.fails=0;return ''}
 o.fails++;if(o.fails>=5){S.eotp=null;m.lock=Date.now()+30000;return 'Too many wrong codes. Locked for 30 seconds (15 minutes in production). Request a new code.'}
 return 'That code is wrong. '+(5-o.fails)+' attempt'+(5-o.fails===1?'':'s')+' left.'}
function appSetupVerify(code){const m=mfaOf(MFA_ROLE());
 if(m.lock>Date.now())return 'Too many wrong codes. Try again in '+Math.ceil((m.lock-Date.now())/1000)+' seconds.';
 const c=m.pend?totpMatch(m.pend,code):null;
 if(c!==null){m.secret=m.pend;m.pend='';m.lastStep=c;m.on=true;m.fails=0;return ''}
 m.fails++;if(m.fails>=5){m.fails=0;m.lock=Date.now()+30000;return 'Too many wrong codes. Locked for 30 seconds (15 minutes in production).'}
 return 'That code is wrong or expired. Codes change every 30 seconds. '+(5-m.fails)+' attempt'+(5-m.fails===1?'':'s')+' left.'}
function loginAfterPwd(){const m=mfaOf(S.admin?'admin':'agent'),k=m.method||'none';S.mfaErr='';S.mfaBackup=false;S.eotp=null;
 if(k==='none'){S.loginStep=1;setRole(S.admin?'admin':'agent');toast('Signed in. Turn on two-step verification in Profile > Security');return}
 if(k==='email'){const e=eSend('login');if(e)S.mfaErr=e;S.loginStep=5}else S.loginStep=2;
 render();const f=document.querySelector('#otp input,#lgCode');if(f)f.focus()}
function secBegin(to,force){secSync();const m=mfaOf(MFA_ROLE()),cur=m.method||'none';if(to===cur&&!force)return;
 S.eotp=null;m.pend='';S.mfaBackup=false;S.sec={to,phase:'',err:'',codes:null};
 if(cur!=='none'){S.sec.phase='cur';if(cur==='email'){const e=eSend('cur');if(e)S.sec.err=e}}else secEnterNew()}
function secEnterNew(){const m=mfaOf(MFA_ROLE()),t=S.sec.to;S.sec.err='';S.eotp=null;
 if(t==='none')return secFinish();
 S.sec.phase='new';if(t==='app')m.pend=b32enc(rndBytes(20));else{const e=eSend('new');if(e)S.sec.err=e}}
function secFinish(){const m=mfaOf(MFA_ROLE()),t=S.sec.to;
 if(t==='none'||t==='email'){m.method=t;m.on=false;m.secret=b32enc(rndBytes(20));m.pend='';m.backup=[];S.sec=null;S.eotp=null;toast(t==='none'?'Two-step verification turned off':'Email verification turned on')}
 else{m.method='app';m.backup=mfaBackupGen();S.sec={to:'app',phase:'codes',err:'',codes:m.backup.slice()};toast('Authenticator app saved')}}
function secCancel(){const m=mfaOf(MFA_ROLE());m.pend='';S.sec=null;S.eotp=null}
function secSubmit(code){secSync();const sc=S.sec,m=mfaOf(MFA_ROLE());if(!sc)return;
 if(!code||code.length<6&&!(S.mfaBackup&&sc.phase==='cur')){sc.err='Enter the 6-digit code.';return}
 let e='';
 if(sc.phase==='cur'){e=m.method==='email'?eVerify(code,'cur'):mfaVerify(code);if(!e){S.mfaBackup=false;secEnterNew();return}}
 else if(sc.phase==='new'){e=sc.to==='app'?appSetupVerify(code):eVerify(code,'new');if(!e){secFinish();return}}
 sc.err=e}

const TAX={EK585:{BD:500,UT:500,E5:4000,YQ:9500},BG147:{BD:500,UT:500,E5:4000,YQ:6000},FZ574:{BD:500,UT:500,E5:4000,YQ:1500},QR639:{BD:500,UT:500,E5:4000,YQ:8200},EY285:{BD:500,UT:500,E5:4000,YQ:7800},'G9 503':{BD:500,UT:500,E5:4000,YQ:900},'G9 504':{BD:500,UT:500,E5:4000,YQ:1200},FZ578:{BD:500,UT:500,E5:4000,YQ:1600},EY316:{BD:500,UT:500,E5:4000,YQ:7400},BS331:{BD:500,UT:500,E5:4000,YQ:2500}};
function parseTaxes(s){
 const o={};
 for(const part of String(s).split(',').map(x=>x.trim()).filter(Boolean)){
  const m=part.match(/^([A-Za-z0-9]{2,3})\s+(\d+(?:\.\d+)?)$/);
  if(!m)return null;
  const k=m[1].toUpperCase();o[k]=(o[k]||0)+Math.round(parseFloat(m[2]));
 }
 return o;
}
function markupFor(al,from,to){
 const norm=s=>String(s).replace(/[-–—]/g,'–').toUpperCase();
 const route=from+'–'+to,dom=rtOf(from,to)==='DOM';
 let r=S.rules.find(x=>x.level==='Route'&&norm(x.scope)===route);
 if(!r)r=S.rules.find(x=>x.level==='Airline'&&x.scope.toUpperCase().includes('('+al+')'));
 if(!r)r=S.rules.find(x=>x.level==='Agency'&&x.scope===S.agency);
 if(!r)r=S.rules.find(x=>x.level==='Global'&&(dom?/domestic/i:/international/i).test(x.scope));
 if(!r)r=S.rules.find(x=>x.level==='Global'&&/all/i.test(x.scope));
 return r?{amt:r.amt,rule:r}:{amt:0,rule:null};
}
function calcCore(p){
 const tx=p.tx,taxTotal=Object.values(tx).reduce((a,b)=>a+b,0);
 const gross=p.base+taxTotal;
 const exempt=Object.entries(tx).reduce((a,[k,v])=>a+(S.ait.excl.includes(k)?v:0),0);
 const aitBase=gross-exempt;
 const ait=Math.round(aitBase*Math.round(S.ait.rate*1000)/100000);
 const m=cMatch({al:p.al,rt:p.rt,cab:p.cab,rbd:p.rbd,issue:p.issue,travel:p.travel});
 const cm=m.best;
 const agCom=cm?cAmt(cm,p.base,'agent'):0,arCom=cm?cAmt(cm,p.base,'air'):0;
 const mk=markupFor(p.al,p.from,p.to);
 const perPax=p.base-agCom+taxTotal+ait+mk.amt;
 const costPax=p.base-arCom+taxTotal+ait;
 return {n:p.n,base:p.base,tx,taxTotal,gross,exempt,aitBase,ait,cm,others:m.all.slice(1).map(r=>r.id),agCom,arCom,mk,perPax,total:perPax*p.n,costPax,marginPax:perPax-costPax};
}
function fareCalc(f,n,ctx){
 ctx=ctx||S.search;
 return calcCore({al:f.c,rt:rtOf(ctx.from,ctx.to),cab:'Economy',rbd:'Y',issue:TODAY,travel:ctx.date,from:ctx.from,to:ctx.to,base:f.sup,tx:TAX[f.no]||{},n});
}

};

  <div class="card stack"><h3>Post an adjustment</h3><div class="form">

   <button class="btn pri" data-x="gladj">Post adjustment</button>

 <div class="card stack" style="margin-top:14px"><div class="form">
  <label class="f">Agency<select class="in" data-c="glf|agent">${opt([['all','All agencies'],...agents.map(a=>[a,a])],f.agent)}</select></label>

  ${rows.slice(0,80).map(l=>`<tr><td class="mono">${l.txn}</td><td class="mono">${esc(l.ref)}</td><td><span class="sm muted mono">${agId(l.agent)}</span><div class="sm">${esc(l.agent)}</div></td><td>${l.acct}</td><td>${esc(l.type)}${l.note?`<div class="sm muted">${esc(l.note)}</div>`:''}</td><td>${esc(l.method)}</td><td class="r num">${l.dr?fmt(l.dr):''}</td><td class="r num">${l.cr?fmt(l.cr):''}</td><td class="r num">${fmt(l.bal)}</td><td class="sm" style="white-space:nowrap">${l.ts}</td><td><span class="pill ${l.status==='Posted'?'p-good':l.status==='Held'?'p-warn':'p-mute'}">${l.status}</span></td></tr>`).join('')}</tbody></table></div>

V['m-partial']=()=>{

 return `${head('Partial payments','Set the amount and settlement date per booking. Deadlines are enforced automatically.')}
 <div class="grid g4">${kpi('New requests',String(open),'Waiting for you',open?'wr':'')}${kpi('Active',String(act.length),act.reduce((t,r)=>t+(S.bookings.find(b=>b.pnr===r.pnr).amount-r.paid),0)>0?fmt(act.reduce((t,r)=>t+(S.bookings.find(b=>b.pnr===r.pnr).amount-r.paid),0))+' still to collect':'Nothing outstanding')}${kpi('Overdue, flagged',String(over),'Needs your decision',over?'dn':'')}${kpi('Held from agents',fmt(held),'Partial payments not yet earned')}</div>

 ${dec.length?`<div class="card stack" style="margin-top:14px;border-color:var(--warn)"><h3>Money held on cancelled bookings</h3><p class="sm muted">The agent paid part of the fare before the booking was cancelled. Decide what happens to that money.</p>${dec.map(r=>`<div class="row between"><div><b class="mono">${r.pnr}</b> · ${esc(r.agent)} · ${fmt(r.paid)} held</div><div class="row"><button class="btn" data-x="ppref|${r.id}">Refund to wallet</button><button class="btn bad" data-x="ppfor|${r.id}">Forfeit</button></div></div>`).join('')}</div>`:''}
 <div class="stack" style="margin-top:14px">${reqs.map(r=>{const b=S.bookings.find(x=>x.pnr===r.pnr)||{amount:r.total,pax:'',route:''};
  return `<div class="card stack"><div class="row between"><div><b class="mono">${r.pnr}</b> · ${esc(b.pax)} · ${b.route}<div class="sm muted">${esc(r.agent)} · ${r.id} · booking total ${fmt(b.amount)} · requested ${r.created}</div></div>
  <span class="pill ${r.status==='Requested'?'p-warn':r.status==='Approved'?'p-info':r.status==='Settled'||r.status==='Refunded'?'p-good':r.status==='Overdue'||r.status==='Auto-cancelled'||r.status==='Cancelled'?'p-bad':'p-mute'}">${r.status}</span></div>
  ${r.note?`<p class="sm"><span class="muted">Agent note:</span> ${esc(r.note)} · asked for ${fmt(r.asked)}</p>`:''}
  ${r.status==='Requested'?`<div class="form"><label class="f">Partial amount (৳)<input class="in" id="pa_amt_${r.id}" type="number" min="1" value="${r.asked}"></label>
   <label class="f">Settle balance by<input class="in" type="date" id="pa_due_${r.id}" value="${new Date(Date.parse(S.today)+3*864e5).toISOString().slice(0,10)}"></label>
   <label class="f">If not settled<select class="in" id="pa_rule_${r.id}"><option value="cancel">Cancel the booking automatically</option><option value="flag">Flag for admin to decide</option></select></label>
   <div class="row"><button class="btn good" data-x="ppok|${r.id}">Approve</button><button class="btn bad" data-x="ppno|${r.id}">Reject</button></div></div>
   <p class="sm muted">Minimum partial payment is 10% of the fare. The due date must not be in the past.</p>`:''}
  ${['Approved','Overdue'].includes(r.status)?`<div class="row between"><span class="sm">Paid ${fmt(r.paid)} of ${fmt(b.amount)} · partial ${fmt(r.amount)} · due <b>${dfmt(r.due)}</b> · ${r.rule==='cancel'?'auto-cancel if unsettled':'flag if unsettled'}${r.status==='Overdue'?' · <b class="dn">overdue</b>':ppLeft(r)>=0?' · '+ppLeft(r)+' day(s) left':''}</span>
   <div class="row">${r.status==='Overdue'?`<button class="btn" data-x="ppext|${r.id}">Extend 2 days</button><button class="btn bad" data-x="ppcancel|${r.id}">Cancel booking</button>`:`<button class="btn" data-x="ppext|${r.id}">Extend 2 days</button>`}</div></div>`:''}
  <details><summary class="sm" style="cursor:pointer">History (${r.log.length})</summary><div style="margin-top:8px">${wpLog(r)}</div></details></div>`}).join('')||'<div class="card muted">No partial payment requests.</div>'}</div>`};

function secCard(){const m=mfaOf(MFA_ROLE()),sc=S.sec,cur=m.method||'none',e=mfaMail();
 const opt=(k,t,d)=>`<div class="row between" style="gap:12px;padding:12px;border:1px solid ${cur===k?'var(--accent)':'var(--line)'};border-radius:10px;align-items:flex-start;flex-wrap:nowrap"><div><b>${t}</b>${cur===k?' <span class="pill p-good">Active</span>':''}<div class="sm muted" style="margin-top:2px">${d}</div></div>${cur===k?(k==='app'?`<button class="btn" data-x="sec|app|1">Register new device</button>`:''):`<button class="btn ${k==='none'?'':'pri'}" data-x="sec|${k}">${k==='none'?'Turn off':'Use this'}</button>`}</div>`;
 let panel='';
 if(sc){const err=sc.err?`<p class="sm dn" role="alert">${esc(sc.err)}</p>`:'';
  const inp=`<input class="in mono" id="secCode" inputmode="numeric" maxlength="${S.mfaBackup&&sc.phase==='cur'?9:6}" placeholder="${S.mfaBackup&&sc.phase==='cur'?'Backup code':'6-digit code'}" autocomplete="off" style="max-width:220px;letter-spacing:.25em;text-align:center;font-size:18px">`;
  const btns=`<div class="row"><button class="btn pri" data-x="secgo">Confirm</button><button class="btn" data-x="seccancel">Cancel</button></div>`;
  const helper=S.eotp?`<details class="sm muted"><summary>Prototype inbox</summary><div class="card" style="padding:10px;margin-top:6px">Your TravelHub B2B verification code is <b class="mono">${S.eotp.code}</b>. It expires in 5 minutes.</div></details>`:'';
  if(sc.phase==='cur')panel=cur==='email'
   ?`<h4>Confirm it is you</h4><p class="sm muted">We sent a 6-digit code to ${esc(maskMail(e))}. Enter it to continue.</p>${inp}${err}<div class="row"><button class="btn pri" data-x="secgo">Confirm</button><button class="btn" data-x="secres">Send a new code</button><button class="btn" data-x="seccancel">Cancel</button></div>${helper}`
   :`<h4>Confirm it is you</h4><p class="sm muted">Enter the current code from your authenticator app, or a backup code.</p>${inp}<div class="row"><label class="row sm"><input type="checkbox" data-x="secbk" ${S.mfaBackup?'checked':''}> Use a backup code</label></div>${err}${btns}<details class="sm muted"><summary>Prototype helper</summary><button class="btn" data-x="secdemo">Show current code</button></details>`;
  else if(sc.phase==='new'&&sc.to==='app'){const qr=mfaQrFor(m.pend);panel=`<h4>Register your authenticator app</h4>
   <div class="row" style="gap:16px;align-items:flex-start;flex-wrap:wrap"><div style="width:168px;height:168px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:4px;display:grid;place-items:center">${qr||'<span class="sm muted" style="text-align:center">QR unavailable. Use the key.</span>'}</div>
   <div class="stack" style="flex:1;min-width:220px;gap:6px"><ol class="sm" style="margin:0;padding-left:18px"><li>Open Google Authenticator or Microsoft Authenticator.</li><li>Add an account and scan this QR code.</li><li>Enter the 6-digit code the app shows.</li></ol><div class="sm muted">Cannot scan? Enter this key manually (time-based, 6 digits)</div><div class="mono" style="word-break:break-all"><b>${m.pend.match(/.{1,4}/g).join(' ')}</b></div><div class="sm muted">Account: ${esc(e)}</div></div></div>
   <div class="fx-note" style="margin-top:4px">${ic('shield')}Scan this once. After you confirm, the QR code and key are never shown again, and nothing is asked for them at sign-in. Do not share this screen.</div>${inp}${err}${btns}<details class="sm muted"><summary>Prototype helper</summary><button class="btn" data-x="secdemo">Show current code</button></details>`}
  else if(sc.phase==='new')panel=`<h4>Turn on email verification</h4><p class="sm muted">We sent a 6-digit code to ${esc(maskMail(e))}. Enter it to confirm this address can receive codes.</p>${inp}${err}<div class="row"><button class="btn pri" data-x="secgo">Confirm</button><button class="btn" data-x="secres">Send a new code</button><button class="btn" data-x="seccancel">Cancel</button></div>${helper}`;
  else if(sc.phase==='codes')panel=`<h4>Save your backup codes</h4><p class="sm muted">Each code works once if you lose your phone. They are shown only now. Store them somewhere safe.</p><div class="grid g2" style="gap:8px">${sc.codes.map(c=>`<div class="card mono" style="padding:8px 10px;text-align:center">${c.slice(0,4)}-${c.slice(4)}</div>`).join('')}</div><button class="btn pri" data-x="seccancel">I have saved them. Done</button>`}
 return `<div class="card stack" style="margin-top:14px"><div class="row between"><h3>Two-step verification</h3><span class="pill ${cur==='none'?'p-warn':'p-good'}">${MFA_LBL[cur]}</span></div>
 <p class="sm muted">Choose how you confirm your identity after entering your password. You can change the method at any time. Changing or turning it off asks for a code from your current method first.</p>
 ${opt('email','Email code','A 6-digit code is sent to '+esc(maskMail(e))+' at each sign-in. Valid for 5 minutes.')}
 ${opt('app','Authenticator app','Google Authenticator or Microsoft Authenticator. You scan a QR code once, here in your profile. Sign-in only asks for the code.')}
 ${opt('none','Off','Password only. Not recommended for an account that holds wallet balance.')}
 ${panel?`<div class="stack" style="border-top:1px solid var(--line);padding-top:14px">${panel}</div>`:''}</div>`}

function bind(){
 const reg=$('#regNext');
 if(reg)reg.onclick=()=>{if(S.regStep===1&&!$('#r_name').value.trim())return toast('Enter the agency name');if(S.regStep===3){if(!$('#r_ok').checked)return toast('Please confirm the declaration');S.regDone=true}else S.regStep++;render()};

 const ln=$('#loginNext');if(ln)ln.onclick=()=>{if(!$('#l_u').value.trim()||!$('#l_p').value)return toast('Enter your ID and password');S.admin=/admin/i.test($('#l_u').value);S.loginUser=$('#l_u').value.trim();S.mfaErr='';S.mfaBackup=false;loginAfterPwd()};

 if(otp||bkc){const ins=otp?[...otp.querySelectorAll('input')]:[];
  ins.forEach((el,i)=>{el.oninput=()=>{const v=el.value.replace(/\D/g,'');if(v.length>1){v.slice(0,6).split('').forEach((c,k)=>{if(ins[k])ins[k].value=c});(ins[Math.min(v.length,6)-1]||ins[5]).focus();return}el.value=v;if(v&&ins[i+1])ins[i+1].focus()};el.onkeydown=e=>{if(e.key==='Backspace'&&!el.value&&ins[i-1])ins[i-1].focus();if(e.key==='Enter')$('#otpGo').click()}});

  const go=$('#otpGo');if(go)go.onclick=()=>{const code=bkc?bkc.value:ins.map(x=>x.value).join('');if(!code||(!bkc&&code.length<6)){S.mfaErr='Enter all 6 digits.';return render()}
   const err=mfaVerify(code);if(err){S.mfaErr=err;return render()}
   const m=mfaOf(S.admin?'admin':'agent');S.mfaErr='';
   S.loginStep=1;setRole(S.admin?'admin':'agent');toast('Signed in')};
  const ob=$('#otpBack');if(ob)ob.onclick=()=>{S.loginStep=1;S.mfaErr='';render()}}
 const ds=$('#doSearch');if(ds)ds.onclick=()=>{capSearch();const er=paxErr();if(er)return toast(er);S.search.pax=paxTotal();S.loading=true;render();setTimeout(()=>{S.loading=false;render();toast('Fares refreshed from suppliers')},650)};
 const so=$('#s_sort');if(so)so.onchange=()=>{S.search.sort=so.value;render()};

 const dr=$('#depReq');if(dr)dr.onclick=()=>{const a=+$('#w_a').value;if(a<1000)return toast('Minimum deposit is ৳ 1,000');S.deposits.unshift({id:'D-'+(2292+S.deposits.length-4),agency:S.agency,method:$('#w_m').value,amount:a,ref:$('#w_r').value||'—',time:'Just now',status:'pending'});toast('Deposit request sent to accounts');render()};
 const ma=$('#mkAdd');if(ma)ma.onclick=()=>{S.rules.push({level:$('#mk_l').value,scope:$('#mk_s').value,amt:+$('#mk_v').value||0});toast('Rule added');render()};
 const fa=$('#cf_al');if(fa)fa.onchange=()=>{S.cFilt.al=fa.value;render()};

 const cr=$('#cRun');if(cr)cr.onclick=()=>{const g=i=>$('#'+i).value;const T=S.cTest;
  T.al=g('t_al');T.rt=g('t_rt');T.from=g('t_from').toUpperCase().trim();T.to=g('t_to').toUpperCase().trim();T.cab=g('t_cab');T.rbd=g('t_rbd').toUpperCase().trim();
  T.issue=g('t_is');T.travel=g('t_tr');T.pax=Math.max(1,Math.min(9,parseInt(g('t_pax'))||1));T.fare=parseFloat(g('t_fare'))||0;T.taxes=g('t_tax');
  if(!T.issue||!T.travel||T.fare<=0)return toast('Enter both dates and a base fare above 0');
  if(!parseTaxes(T.taxes))return toast('Taxes must look like BD 500, UT 500, YQ 9500');

 const as=$('#aitSave');if(as)as.onclick=()=>{const r=parseFloat($('#ait_rate').value);

  S.cf=f;S.cErr='';const air=parseFloat(f.air),ag=parseFloat(f.agent);

  else if(isNaN(air)||isNaN(ag)||air<0||ag<0)S.cErr='Enter the airline and agent commission as numbers of 0 or more.';

  if(ag>air)setTimeout(()=>toast('Saved. Agent commission is above airline commission, so each ticket loses margin.'),2700);

document.addEventListener('click',e=>{
 const t=e.target.closest('[data-go],[data-role],[data-trip],[data-air],[data-pick],[data-rules],[data-cal],[data-bk],[data-bact],[data-dep],[data-adv],[data-soon],[data-ins],[data-crt],[data-cst],[data-cact]');if(!t)return;
 const d=t.dataset;
 if(d.role)return setRole(d.role);
 if(d.go){if(d.go==='a-flights'||d.go==='a-dash'){}e.preventDefault();return go(d.go)}
 if(d.trip){S.search.trip=d.trip;return render()}
 if(d.air){S.search.airline=d.air;return render()}
 if(d.rules){S.search.open=S.search.open===d.rules?null:d.rules;return render()}
 if(d.cal){S.search.date='2026-11-'+String(d.cal).padStart(2,'0');toast('Date set to '+d.cal+' Nov');return render()}
 if(d.pick)return XH.pickb(d.pick,'');
 if(d.bk){S.bkFilter=d.bk;return render()}
 if(d.bact){const[a,p]=d.bact.split(':');const b=S.bookings.find(x=>x.pnr===p);
  if(wfBact(a,b))return render();
  if(a==='issue'){if(!issueBooking(b))return render();toast('Ticketed '+p+' · wallet debited '+fmt(b.amount))}
  if(a==='cancel'){b.status='Cancelled';toast('Cancelled '+p)}
  if(a==='void'){b.status='Cancelled';post({ref:p,agent:S.agency,type:'Void',lines:[['Airline payable',b.amount,0],['Agent wallet',0,b.amount]]});toast('Voided '+p+' · wallet credited '+fmt(b.amount))}
  if(a==='refund'){const ra=Math.max(0,b.amount-7000),rf=Math.min(S.fees.refund,ra),net=ra-rf;b.status='Refunded';post({ref:p,agent:S.agency,type:'Refund',lines:[['Airline payable',ra,0],['Agent wallet',0,net],['Platform revenue',0,rf]]});toast('Refund '+fmt(net)+' after penalties and fee')}
  if(a==='reissue'){toast('Reissue fee '+fmt(S.fees.reissue)+' plus fare difference applies')}
  return render()}
 if(d.dep){const[a,id]=d.dep.split(':');const x=S.deposits.find(y=>y.id===id);if(x.status!=='pending')return;x.status=a;if(a==='approved')post({ref:id,agent:x.agency,type:'Deposit',method:x.method,lines:[['Bank and MFS clearing',x.amount,0],['Agent wallet',0,x.amount]]});toast('Deposit '+id+' '+a);return render()}
 if(d.adv){const a=S.agencies[+d.adv];if(a.step>=3){S.agencies.splice(+d.adv,1);toast(a.name+' activated')}else{a.step++;toast('Moved to next stage')}return render()}
 if(d.crt){S.cFilt.rt=d.crt;return render()}
 if(d.cst){S.cFilt.st=d.cst;return render()}
 if(d.cact){const[a,id]=d.cact.split(':');const r=S.comm.find(x=>x.id===id);const now=new Date().toTimeString().slice(0,5);
  if(a==='new'){S.cDel=null;S.cEdit=null;S.cf=null;S.cErr='';render();const el=document.getElementById('cform');if(el)el.scrollIntoView({block:'start'});return}
  if(a==='edit'){S.cDel=null;S.cEdit=id;S.cErr='';S.cf={al:r.al,rt:r.rt,cab:r.cab,rbd:r.rbd||'',from:r.from,to:r.to,basis:r.basis,kind:r.kind,air:String(r.air),agent:String(r.agent)};render();const el=document.getElementById('cform');if(el)el.scrollIntoView({block:'start'});return}
  if(a==='pause'){r.paused=!r.paused;S.cDel=null;S.audit.unshift({t:'12 Oct '+now,u:'Super admin',m:(r.paused?'Paused ':'Resumed ')+id});toast(id+(r.paused?' paused':' resumed'));return render()}
  if(a==='del'){if(S.cDel!==id){S.cDel=id;return render()}S.comm=S.comm.filter(x=>x.id!==id);S.cDel=null;if(S.cEdit===id){S.cEdit=null;S.cf=null}S.audit.unshift({t:'12 Oct '+now,u:'Super admin',m:'Deleted '+id});toast(id+' deleted');return render()}
  return}
 if(d.soon)return toast(d.soon+' opens in the next design round');
 if(d.ins)return toast(d.ins+' policy would be issued from wallet');
});
